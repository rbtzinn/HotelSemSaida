[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*,art/previews/*,art/source/*,art/future/raw/*,art/incoming/*,docs/*,site/*,build/*"
export_path=""
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<style>html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
<script>
// A página não rola, não dá zoom e não \"puxa\" quando dois dedos mexem ao mesmo tempo
for (const type of [\"gesturestart\", \"gesturechange\", \"gestureend\", \"touchmove\"]) {
	document.addEventListener(type, (event) => event.preventDefault(), { passive: false });
}
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
